[core]
  editor = vim
  autocrlf = false
  ignoreCase = false
  pager = delta

# Git 2.54 以降の設定フックで、既存のリポジトリフックと併用する。
# Codex / Claude Code の新規ブランチ命名を検査する。
[hook "agent-branch-name"]
  event = reference-transaction
  command = "/bin/bash \"${XDG_CONFIG_HOME:-$HOME/.config}/git/hooks/agent-branch-name\""

# detached HEAD では onbranch の署名設定が効かないため、署名処理前に止める。
[hook "agent-attached-head"]
  event = prepare-commit-msg
  command = "/bin/bash \"${XDG_CONFIG_HOME:-$HOME/.config}/git/hooks/agent-attached-head\""

# colum 表示で内容が多ければ横に並べる
[column]
  ui = auto

[color]
  ui = true

[init]
  defaultBranch = main

[branch]
  sort = -committerdate

[fetch]
  prune = true
  pruneTags = true
  all = true

[pull]
  ff = true

[merge]
  ff = false
  conflictstyle = zdiff3

[rebase]
  autoStash = true
  autoSquash = true
  updateRefs = true

[push]
  default = simple
  autoSetupRemote = true
  followTags = true

[commit]
  verbose = true
  gpgsign = true

[rerere]
  enabled = true
  autoUpdate = true

[diff]
  colorMoved = plain
  algorithm = histogram
  mnemonicPrefix = true
  renames = true

[tag]
  sort = version:refname

[interactive]
  diffFilter = delta --color-only

[delta]
  navigate = true
  light = false
  side-by-side = true
  line-numbers = true

[grep]
  patternType = perl

[feature]
  experimental = true

# reftable は lazy.nvim と互換性がないため files を維持
# ref: https://github.com/folke/lazy.nvim/issues/2046
[init]
  defaultRefFormat = files

[gpg]
  format = ssh

[gpg "ssh"]
  program = /Applications/1Password.app/Contents/MacOS/op-ssh-sign
  allowedSignersFile = ~/.ssh/allowed_signers
