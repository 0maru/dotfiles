model = "gpt-6-astra"
model_reasoning_effort = "high"
approvals_reviewer = "auto_review"
model_reasoning_summary = "none"
personality = "pragmatic"
approval_policy = "on-request"
default_permissions = "workspace-dev"
allow_login_shell = false

[tools]
web_search = true

[permissions.workspace-dev]
extends = ":workspace"

[permissions.workspace-dev.filesystem]
":tmpdir" = "read"
":slash_tmp" = "read"
"~/.clasprc.json" = "write"
"~/.docker" = "write"
"~/.cache/uv" = "write"

[permissions.workspace-dev.network]
enabled = true

[agents]
max_threads = 6
max_depth = 1

[tui]
status_line = [
  "model-with-reasoning",
  "project-root",
  "context-remaining",
  "git-branch",
  "five-hour-limit",
  "weekly-limit",
]
animations = true
notifications = true


[features]
hooks = true
multi_agent = true
goals = true
memories = false

[features.network_proxy]
enabled = true

[features.network_proxy.domains]
"**.github.com" = "allow"
"**.githubusercontent.com" = "allow"
"**.githubassets.com" = "allow"
"**.github.io" = "allow"
"**.ghcr.io" = "allow"
"**.github.dev" = "allow"
"**.githubcopilot.com" = "allow"
"npm.flatt.tech" = "allow"

[[skills.config]]
enabled = true

[plugins."github@openai-curated"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."browser-use@openai-bundled"]
enabled = true

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@latest"]

[mcp_servers.atlassian]
enabled = true
url = "https://mcp.atlassian.com/v1/sse"
